{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Canvas</title>
    <link rel="stylesheet" href="{% static 'canvas_app/canvas.css' %}" />
  </head>
  <body>
    <div class="layout">
      <aside class="toolbar">
        <h1>Canvas Playground</h1>
        <p>Experiment with drawing, erasing, filling and exporting your artwork.</p>
        <div class="input-row">
          <label for="color">Color</label>
          <input id="color" type="color" value="#4299e1" />
        </div>
        <div class="input-row">
          <label for="size">Brush size</label>
          <input id="size" type="range" min="1" max="40" value="6" />
        </div>
        <div class="input-row">
          <label for="aspect">Aspect ratio</label>
          <select id="aspect">
            <option value="16:9" selected>16:9 (Landscape)</option>
            <option value="4:3">4:3</option>
            <option value="1:1">1:1 (Square)</option>
            <option value="3:4">3:4 (Portrait)</option>
            <option value="9:16">9:16 (Tall)</option>
          </select>
        </div>
        <div id="text-controls" class="is-hidden">
          <div class="input-row">
            <label for="text">Text</label>
            <input id="text" type="text" placeholder="Type here" />
          </div>
          <div class="input-row">
            <label for="font-size">Font size</label>
            <input id="font-size" type="range" min="12" max="96" value="32" />
          </div>
          <div class="input-row">
            <label for="font-color">Font color</label>
            <input id="font-color" type="color" value="#1a202c" />
          </div>
        </div>
        <div class="input-row">
          <label>Tool</label>
        </div>
        <div>
          <button data-tool="draw">Pen</button>
          <button data-tool="erase" class="secondary">Eraser</button>
          <button data-tool="text" class="secondary">Text</button>
          <button id="fill" class="secondary">Fill canvas</button>
        </div>
        <button id="clear" class="secondary">Clear canvas</button>
        <button id="download">Download PNG</button>
        <p class="status" id="status">Ready</p>
      </aside>
      <section class="canvas-wrapper">
        <div class="canvas-stack">
          <canvas id="canvas" width="1280" height="720" aria-label="Drawing canvas"></canvas>
          <canvas id="preview" width="1280" height="720" aria-hidden="true"></canvas>
        </div>
      </section>
    </div>
    <script src="{% static 'canvas_app/canvas.js' %}"></script>
  </body>
</html>
